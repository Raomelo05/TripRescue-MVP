[project]
name = "triprescue-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi[standard]>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false
